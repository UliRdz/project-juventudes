<!-- favicon.svg -->
<!-- PURPOSE: The small icon shown in the browser tab. Referenced by index.html. -->
<!-- INTENDED OUTPUT LINK: prevents a 404 for the favicon and gives the tab a
     brand-colored mark (Deep Blue background, white graduation cap "B" for Becas). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"> <!-- 64x64 canvas. -->
  <rect width="64" height="64" rx="12" fill="#0B4F81"/>          <!-- Rounded square in brand Deep Blue (--color-primary). -->
  <path d="M32 16 L52 26 L32 36 L12 26 Z" fill="#FFFFFF"/>       <!-- White graduation-cap mortarboard shape. -->
  <path d="M20 30 v8 c0 4 24 4 24 0 v-8" fill="none" stroke="#A8C8E6" stroke-width="3"/> <!-- Light Blue cap base curve. -->
</svg>                                                            <!-- End icon. -->
